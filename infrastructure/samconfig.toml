version = 0.1

[default.global.parameters]
stack_name = "lzta-framework-dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
resolve_s3 = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
fail_on_empty_changeset = false
# Run the first deployment with --guided to supply region and required parameters.
# User-approved weights and threshold are defaults in template.yaml.
