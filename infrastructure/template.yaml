AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Single-authorizer LZTA/BBAD reproduction - CloudTrail baselines and JWT-authenticated API enforcement.

Parameters:
  LogBucketName:
    Type: String
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '[a-z0-9][a-z0-9-]*[a-z0-9]'
    Description: Globally unique bucket for CloudTrail logs.
  StageName:
    Type: String
    Default: dev
    AllowedPattern: '[a-zA-Z0-9]+'
  RiskWeightsJson:
    Type: String
    Default: '{"unknown_ip":50,"off_hours":25,"unknown_user_agent":15,"unusual_sensitive_action":30}'
    MinLength: 2
    Description: User-supplied anomaly weights, configurable for later experiments.
  DenyThreshold:
    Type: Number
    Default: 70
    MinValue: 0
    Description: User-supplied single-stage rule - deny scores greater than or equal to this value.
  SensitiveActionsJson:
    Type: String
    MinLength: 2
    Description: Explicit JSON list of sensitive CloudTrail service:Action names.
  IdentityMapJson:
    Type: String
    MinLength: 2
    Description: JSON mapping verified JWT subjects to exact userIdentity.arn values in CloudTrail.
  RouteActionMapJson:
    Type: String
    MinLength: 2
    Description: JSON mapping API routes (GET /protected) to CloudTrail service:Action names.
  JwtIssuer:
    Type: String
    AllowedPattern: 'https://.+'
  JwtAudience:
    Type: String
    MinLength: 1
  JwtJwksUrl:
    Type: String
    AllowedPattern: 'https://.+'
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1096, 1827, 2192, 2557, 2922, 3288, 3653]
  CaptureDataEvents:
    Type: String
    AllowedValues: ['true', 'false']
    Description: Explicitly choose whether to capture account-wide S3 object, Lambda invoke, and DynamoDB item data events (billable). Framework telemetry resources are excluded.

Conditions:
  WithDataEvents: !Equals [!Ref CaptureDataEvents, 'true']

Globals:
  Function:
    Runtime: python3.14
    CodeUri: ../src/
    MemorySize: 128
    Timeout: 10

Resources:
  UserBehaviorProfiles:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true

  SecurityLogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref LogBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SecurityLogsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SecurityLogs
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt SecurityLogs.Arn, !Sub '${SecurityLogs.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: TrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt SecurityLogs.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail'
          - Sid: TrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub '${SecurityLogs.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${AWS::StackName}-trail'

  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: SecurityLogsPolicy
    Properties:
      TrailName: !Sub '${AWS::StackName}-trail'
      S3BucketName: !Ref SecurityLogs
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      AdvancedEventSelectors:
        - Name: ManagementEvents
          FieldSelectors:
            - Field: eventCategory
              Equals: [Management]
        - !If
          - WithDataEvents
          - Name: S3ObjectEvents
            FieldSelectors:
              - Field: eventCategory
                Equals: [Data]
              - Field: resources.type
                Equals: ['AWS::S3::Object']
              - Field: resources.ARN
                NotStartsWith: [!Sub '${SecurityLogs.Arn}/']
          - !Ref AWS::NoValue
        - !If
          - WithDataEvents
          - Name: LambdaInvokeEvents
            FieldSelectors:
              - Field: eventCategory
                Equals: [Data]
              - Field: resources.type
                Equals: ['AWS::Lambda::Function']
              - Field: resources.ARN
                NotStartsWith:
                  - !GetAtt ProcessBehavioralLogs.Arn
                  - !GetAtt ZeroTrustAuthorizer.Arn
                  - !GetAtt MockApiTarget.Arn
          - !Ref AWS::NoValue
        - !If
          - WithDataEvents
          - Name: DynamoDBItemEvents
            FieldSelectors:
              - Field: eventCategory
                Equals: [Data]
              - Field: resources.type
                Equals: ['AWS::DynamoDB::Table']
              - Field: resources.ARN
                NotStartsWith: [!GetAtt UserBehaviorProfiles.Arn]
          - !Ref AWS::NoValue

  IngestionFailures:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      MessageRetentionPeriod: 1209600

  ProcessBehavioralLogs:
    Type: AWS::Serverless::Function
    Properties:
      Description: process-behavioral-logs - gzip CloudTrail batches to UserBehaviorProfiles.
      Handler: lzta.baseline.lambda_handler
      Timeout: 60
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserBehaviorProfiles
          LOG_BUCKET: !Ref LogBucketName
          LOG_PREFIX: !Sub 'AWSLogs/${AWS::AccountId}/CloudTrail/'
      EventInvokeConfig:
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt IngestionFailures.Arn
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              # Parameter avoids the S3 notification dependency cycle.
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${LogBucketName}/AWSLogs/${AWS::AccountId}/CloudTrail/*'
            - Effect: Allow
              Action: [dynamodb:UpdateItem, dynamodb:PutItem]
              Resource: !GetAtt UserBehaviorProfiles.Arn
      Events:
        LogDelivered:
          Type: S3
          Properties:
            Bucket: !Ref SecurityLogs
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Sub 'AWSLogs/${AWS::AccountId}/CloudTrail/'
                  - Name: suffix
                    Value: .json.gz

  ZeroTrustAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      Description: zero-trust-authorizer - signed JWT verification and single-stage behavioral risk decision.
      Handler: lzta.authorizer.lambda_handler
      Environment:
        Variables:
          PROFILES_TABLE: !Ref UserBehaviorProfiles
          RISK_WEIGHTS_JSON: !Ref RiskWeightsJson
          DENY_THRESHOLD: !Ref DenyThreshold
          SENSITIVE_ACTIONS_JSON: !Ref SensitiveActionsJson
          IDENTITY_MAP_JSON: !Ref IdentityMapJson
          ROUTE_ACTION_MAP_JSON: !Ref RouteActionMapJson
          JWT_ISSUER: !Ref JwtIssuer
          JWT_AUDIENCE: !Ref JwtAudience
          JWT_JWKS_URL: !Ref JwtJwksUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt UserBehaviorProfiles.Arn

  LztaApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref StageName
      EndpointConfiguration:
        Type: REGIONAL
      Auth:
        DefaultAuthorizer: ZeroTrust
        Authorizers:
          ZeroTrust:
            FunctionArn: !GetAtt ZeroTrustAuthorizer.Arn
            FunctionPayloadType: REQUEST
            Identity:
              Headers: [Authorization]
              ReauthorizeEvery: 0

  MockApiTarget:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lzta.target.lambda_handler
      Events:
        Protected:
          Type: Api
          Properties:
            RestApiId: !Ref LztaApi
            Path: /protected
            Method: GET

  BaselineLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProcessBehavioralLogs}'
      RetentionInDays: !Ref LogRetentionDays
  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ZeroTrustAuthorizer}'
      RetentionInDays: !Ref LogRetentionDays
  TargetLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${MockApiTarget}'
      RetentionInDays: !Ref LogRetentionDays

  DeniedRequestsQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AWS::StackName}/denied-requests'
      LogGroupNames: [!Ref AuthorizerLogGroup]
      QueryString: 'fields @timestamp, user, ip, riskScore, anomalies | filter eventType = "access_decision" and verdict = "Deny" | sort @timestamp desc | limit 100'
  LatencyQuery:
    Type: AWS::Logs::QueryDefinition
    Properties:
      Name: !Sub '${AWS::StackName}/lambda-report-latency'
      LogGroupNames: [!Ref AuthorizerLogGroup]
      QueryString: 'filter @type = "REPORT" | stats count(*) as requests, avg(@duration) as avgMs, max(@duration) as maxMs, pct(@duration, 95) as p95Ms, max(@initDuration) as maxInitMs'
  SecurityDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardBody: !Sub |
        {"widgets":[
          {"type":"log","x":0,"y":0,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Denied requests","view":"table","query":"SOURCE '${AuthorizerLogGroup}' | fields @timestamp, user, ip, riskScore, anomalies | filter eventType = 'access_decision' and verdict = 'Deny' | sort @timestamp desc | limit 100"}},
          {"type":"log","x":12,"y":0,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Decisions over time","view":"timeSeries","query":"SOURCE '${AuthorizerLogGroup}' | filter eventType = 'access_decision' | stats count(*) by bin(5m), verdict"}},
          {"type":"log","x":0,"y":6,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Users with repeated denials","view":"table","query":"SOURCE '${AuthorizerLogGroup}' | filter eventType = 'access_decision' and verdict = 'Deny' | stats count(*) as denied by user | sort denied desc"}},
          {"type":"log","x":12,"y":6,"width":12,"height":6,"properties":{"region":"${AWS::Region}","title":"Authorizer latency and cold starts","view":"table","query":"SOURCE '${AuthorizerLogGroup}' | filter @type = 'REPORT' | stats count(*) as requests, avg(@duration) as avgMs, max(@duration) as maxMs, max(@initDuration) as maxInitMs"}}
        ]}

Outputs:
  ProtectedEndpoint:
    Value: !Sub 'https://${LztaApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}/protected'
  ProfilesTable:
    Value: !Ref UserBehaviorProfiles
  LogBucket:
    Value: !Ref SecurityLogs
  AuthorizerFunction:
    Value: !Ref ZeroTrustAuthorizer
  AuthorizerLogs:
    Value: !Ref AuthorizerLogGroup
  BaselineFunction:
    Value: !Ref ProcessBehavioralLogs
  DashboardName:
    Value: !Ref SecurityDashboard
  IngestionFailureQueue:
    Value: !Ref IngestionFailures
